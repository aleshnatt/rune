[package]
name = "rune-ring"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Naufal Ziyaadaturrahman <naufal@aleshnatt.com>"]
description = "Post-quantum lattice-based ring signature scheme from Ring-LWE with sequential challenge chain construction"
documentation = "https://docs.rs/rune-ring"
homepage = "https://github.com/aleshnatt/rune-ring"
repository = "https://github.com/aleshnatt/rune-ring"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "post-quantum", "ring-signature", "lattice", "rlwe"]
categories = ["cryptography"]
exclude = [
    "paper/",
    "whitepaper/",
    ".github/",
    "scratch.rs",
    ".DS_Store",
    "/Cargo.lock",
]

[lib]
name = "rune_ring"
path = "src/lib.rs"

[dependencies]
sha3 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rand_chacha = "0.3"

[features]
default = []
serde = ["dep:serde"]

[[bench]]
name = "bench"
harness = false
